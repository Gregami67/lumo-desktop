[[permission]]
identifier = "allow-skill-sync-bundle"
description = "Allow the authenticated main webview to materialize a skill bundle."
commands.allow = ["skill_sync_bundle"]

[[permission]]
identifier = "allow-skill-cache-retain"
description = "Allow the authenticated main webview to discard stale cached skills."
commands.allow = ["skill_cache_retain"]

[[permission]]
identifier = "allow-skill-execute-script"
description = "Execute a synced skill script through the existing shell permission gate."
commands.allow = ["skill_execute_script"]
