[[permission]]
identifier = "allow-desktop-notification-permission"
description = "Checks or requests permission for native desktop notifications."
commands.allow = ["desktop_notification_permission", "desktop_notification_permission_state"]

[[permission]]
identifier = "allow-desktop-notification-show"
description = "Shows a native notification for the active account from the main webview."
commands.allow = ["desktop_notification_show"]

[[permission]]
identifier = "allow-desktop-notification-open-settings"
description = "Opens the operating system notification settings from the main webview."
commands.allow = ["desktop_notification_open_settings"]
