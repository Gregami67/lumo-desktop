[[permission]]
identifier = "allow-get-tool-registry"
description = "Returns the native tool registry manifests."
commands.allow = ["get_tool_registry"]

[[permission]]
identifier = "allow-set-connector-enabled"
description = "Enables or disables a connector globally."
commands.allow = ["set_connector_enabled"]

[[permission]]
identifier = "allow-set-tool-policy"
description = "Sets the approval policy (auto-approve/ask/disable) for a connector tool."
commands.allow = ["set_tool_policy"]

[[permission]]
identifier = "allow-always-allow-tool"
description = "Lets a connector tool run without asking even after untrusted content has been read."
commands.allow = ["always_allow_tool"]

[[permission]]
identifier = "allow-respond-tool-approval"
description = "Responds to a pending tool-call approval request (approve or deny)."
commands.allow = ["respond_tool_approval"]

[[permission]]
identifier = "allow-invoke-tool"
description = "Executes a native connector tool."
commands.allow = ["invoke_tool"]

[[permission]]
identifier = "allow-connect-connector"
description = "Obtains credentials, opens a session, or cancels a pending connection."
commands.allow = ["connect_connector", "cancel_connector_connection"]

[[permission]]
identifier = "allow-disconnect-connector"
description = "Removes stored connector credentials."
commands.allow = ["disconnect_connector"]

[[permission]]
identifier = "allow-save-mcp-server"
description = "Registers or updates an MCP server configuration."
commands.allow = ["save_mcp_server"]

[[permission]]
identifier = "allow-list-mcp-servers"
description = "Lists configured MCP servers."
commands.allow = ["list_mcp_servers"]

[[permission]]
identifier = "allow-remove-mcp-server"
description = "Removes an MCP server configuration."
commands.allow = ["remove_mcp_server"]

[[permission]]
identifier = "allow-is-secure-storage-available"
description = "Reports whether the OS credential store is reachable on this machine."
commands.allow = ["is_secure_storage_available"]

[[permission]]
identifier = "allow-pick-directory"
description = "Opens a folder picker dialog."
commands.allow = ["pick_directory"]

[[permission]]
identifier = "allow-get-builtin-tools"
description = "Returns internal model-visible harness tools, separate from connector UI."
commands.allow = ["get_builtin_tools"]
