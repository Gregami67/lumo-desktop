[[permission]]
identifier = "allow-schedule-connect"
description = "Connects the authenticated main webview to the local schedule coordinator."
commands.allow = ["schedule_connect"]

[[permission]]
identifier = "allow-schedule-replace"
description = "Replaces the active account's complete schedule timing snapshot."
commands.allow = ["schedule_replace"]

[[permission]]
identifier = "allow-schedule-pending"
description = "Reads durable pending schedule runs without acknowledging them."
commands.allow = ["schedule_pending"]

[[permission]]
identifier = "allow-schedule-unsettled"
description = "Reads accepted and running schedule runs for reconciliation."
commands.allow = ["schedule_unsettled"]

[[permission]]
identifier = "allow-schedule-report-status"
description = "Reports a schedule run's delivery or execution status."
commands.allow = ["schedule_report_status"]

[[permission]]
identifier = "allow-register-schedule-execution-context"
description = "Registers run-scoped connector permissions for an accepted schedule run."
commands.allow = ["register_schedule_execution_context"]

[[permission]]
identifier = "allow-schedule-run-now"
description = "Queues an immediate run of an active schedule without changing its timing."
commands.allow = ["schedule_run_now"]
